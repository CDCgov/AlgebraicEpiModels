[project]
site_name = "AlgebraicEpiModels"
site_url = "https://cdcgov.github.io/AlgebraicEpiModels"
repo_url = "https://github.com/CDCgov/AlgebraicEpiModels"
repo_name = "CDCgov/AlgebraicEpiModels"

nav = [
    { "Home" = "index.md" },
    { "Getting started" = "getting-started.md" },
    { "Packages" = [
        { "AlgebraicEpiMech" = "packages/algebraicepimech.md" },
        { "ConfigurableEpi" = "packages/configurableepi.md" },
    ] },
    { "Examples" = [
        { "Building models" = [
            { "Compartmental models" = "examples/compartmental_models.md" },
            { "Stratified models" = "examples/stratified_models.md" },
            { "Multistrain and immune history" = "examples/multistrain_immune_history.md" },
        ] },
        { "Inference" = [
            { "Inference engines" = "examples/inference_engines.md" },
            { "Arrival processes" = "examples/arrival_process.md" },
            { "Low-level filtering" = "examples/low_level_filtering.md" },
        ] },
    ] },
    { "API reference" = [
        { "AlgebraicEpiMech" = "api/algebraicepimech.md" },
        { "ConfigurableEpi" = "api/configurableepi.md" },
    ] },
    { "Contributing" = [
        { "Maintaining the docs" = "development/docs.md" },
    ] },
]

# provides for math rendering
extra_javascript = ["javascripts/mathjax.js", "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js"]

[project.theme]
language = "en"
features = [
    "announce.dismiss",
    "content.tooltips",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.prune",
    "navigation.sections",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
    "toc.integrate",
]

[project.markdown_extensions.toc]
permalink = true

[project.plugins.offline]

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.admonition]

# DocumenterMarkdown writes heading ids as `# Title {#id}`
[project.markdown_extensions.attr_list]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.mdx_truly_sane_lists]
