name: AlgebraicEpiMech tests

on:
  pull_request:
    paths:
      - AlgebraicEpiMech/**
      - .github/workflows/test-algebraicepimech.yaml
  push:
    branches: [master, main]
    paths:
      - AlgebraicEpiMech/**
      - .github/workflows/test-algebraicepimech.yaml

permissions:
  actions: write
  contents: read

jobs:
  test:
    name: AlgebraicEpiMech Julia ${{ matrix.julia-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.11', '1.12', '1.13']

    steps:
    - uses: actions/checkout@v7
    - uses: julia-actions/setup-julia@v3
      with:
        version: ${{ matrix.julia-version }}
        project: AlgebraicEpiMech
    - uses: julia-actions/cache@v3
    - uses: julia-actions/julia-buildpkg@v1
      with:
        project: AlgebraicEpiMech
    - uses: julia-actions/julia-runtest@v1
      with:
        project: AlgebraicEpiMech
